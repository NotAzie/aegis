<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Quantum V2</title>
  <style>
    :root {
      --bg: #050508;
      --card-bg: rgba(15, 17, 26, 0.7);
      --border: rgba(6, 182, 212, 0.25);
      --accent: #06b6d4;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 25%, #10121e 0%, #050508 85%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .wrapper {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(139, 92, 246, 0.25));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.3);
      color: var(--accent);
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .search-box {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      transition: all 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25), 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
    }
    .search-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .metrics-bar {
      width: 100%;
      background: rgba(6, 182, 212, 0.06);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" width="36" height="36"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    </div>
    <div style="text-align: center;">
      <h1>Aegis Quantum V2</h1>
      <p class="tagline">Sub-15ns O(1) HyperTrie • Shannon Entropy Detection • Synthetic Cohorts</p>
    </div>

    <form class="search-box" onsubmit="event.preventDefault(); doNav();">
      <input type="text" id="target" class="search-input" placeholder="Navigate securely or search anonymously..." autofocus />
      <button type="submit" class="search-btn">Go</button>
    </form>

    <div class="metrics-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="dot"></span>
        <span>NexusCore Active</span>
      </div>
      <span style="color: var(--muted);">Zero-Disk Footprint Guaranteed</span>
    </div>
  </div>

  <script>
    function doNav() {
      const q = document.getElementById('target').value.trim();
      if (!q) return;
      if (/^https?:\/\//i.test(q)) {
        window.location.href = q;
      } else if (!q.includes(' ') && q.includes('.')) {
        window.location.href = 'https://' + q;
      } else {
        window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      }
    }
  </script>
</body>
</html>
