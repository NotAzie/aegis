<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis PrivacyBrowser V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <div class="nav-controls">
      <button id="btn-back" class="nav-btn" title="Back (Alt+Left)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <button id="btn-forward" class="nav-btn" title="Forward (Alt+Right)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
      <button id="btn-reload" class="nav-btn" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>

    <div class="omnibox-container">
      <div id="security-indicator" class="secure" title="Aegis Strict Quantum Shield Active">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      </div>
      <input type="text" id="url-bar" placeholder="Enter URL or search privately..." spellcheck="false" autocomplete="off" />
      <button id="btn-clear-url" class="icon-btn clear-btn">x</button>
    </div>

    <div class="action-controls">
      <button id="radar-toggle-btn" class="radar-badge active" title="Toggle Aegis Quantum Radar HUD">
        <div class="pulse-ring"></div>
        <span id="blocked-count-badge">0</span>
      </button>
    </div>

    <div class="window-controls">
      <button id="btn-minimize" class="win-btn">─</button>
      <button id="btn-maximize" class="win-btn">□</button>
      <button id="btn-close" class="win-btn win-close">x</button>
    </div>
  </div>

  <!-- Holographic Privacy Radar HUD -->
  <div id="radar-hud" class="hud-panel hidden">
    <div class="hud-header">
      <div class="hud-title">
        <span class="live-dot"></span>
        <h3>Aegis Quantum Radar HUD</h3>
      </div>
      <span class="hud-badge">V2 PARADIGM SHIFT</span>
    </div>

    <canvas id="radar-canvas" width="340" height="120"></canvas>

    <div class="hud-grid">
      <div class="hud-stat-box">
        <div class="stat-num" id="stat-total-blocked">0</div>
        <div class="stat-label">Trackers Terminated</div>
      </div>
      <div class="hud-stat-box">
        <div class="stat-num" id="stat-entropy-blocked">0</div>
        <div class="stat-label">Zero-Day Entropy Threats</div>
      </div>
    </div>

    <div class="hud-features">
      <div class="hud-feature">
        <span>[ACCEL] AegisHyperTrie (O(1))</span>
        <span class="state-pill">Sub-15ns</span>
      </div>
      <div class="hud-feature">
        <span>[ENTROPY] EntropyShield (Shannon)</span>
        <span class="state-pill">Active</span>
      </div>
      <div class="hud-feature">
        <span>[GHOST] GhostEngine Synthetic Cohorts</span>
        <span class="state-pill">Active</span>
      </div>
    </div>

    <div class="hud-log" id="hud-recent-log">System initialized. Awaiting origin requests...</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
