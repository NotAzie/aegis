<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyBrowser — Safe Harbor</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at 50% 20%, #161822 0%, #09090b 80%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .shield-emblem {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14.5px;
    }

    .search-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 14px 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .search-card:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2), 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
    }

    .search-btn {
      padding: 10px 18px;
      background: var(--accent-cyan);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      transition: opacity 0.15s ease;
    }

    .search-btn:hover {
      opacity: 0.9;
    }

    .quick-tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
    }

    .tile {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.18s ease;
    }

    .tile:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .privacy-status-bar {
      width: 100%;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-emerald);
      font-weight: 500;
    }

    .status-tag {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <div class="shield-emblem">
        <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v6h-2V7zm0 8h2v2h-2v-2z"/></svg>
      </div>
      <h1>PrivacyBrowser</h1>
      <p class="subtitle">Zero Tracking. Zero Fingerprints. Strict HTTPS Shield.</p>
    </div>

    <form class="search-card" onsubmit="event.preventDefault(); doSearch();">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--text-muted)"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search-box" class="search-input" placeholder="Search anonymously with DuckDuckGo or type a web address..." autofocus />
      <button type="submit" class="search-btn">Search</button>
    </form>

    <div class="quick-tiles">
      <a href="https://duckduckgo.com" class="tile">
        <span>🦆 DuckDuckGo</span>
      </a>
      <a href="https://github.com" class="tile">
        <span>🐙 GitHub</span>
      </a>
      <a href="https://news.ycombinator.com" class="tile">
        <span>⚡ Hacker News</span>
      </a>
      <a href="https://wikipedia.org" class="tile">
        <span>📚 Wikipedia</span>
      </a>
    </div>

    <div class="privacy-status-bar">
      <div class="status-left">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span>Aegis Shield Protection Active</span>
      </div>
      <span class="status-tag">Memory Partition • Zero Disk Traces</span>
    </div>
  </div>

  <script>
    function doSearch() {
      const q = document.getElementById('search-box').value.trim();
      if (!q) return;
      if (/^https?:\/\//i.test(q)) {
        window.location.href = q;
      } else if (!q.includes(' ') && q.includes('.')) {
        window.location.href = 'https://' + q;
      } else {
        window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      }
    }
  </script>
</body>
</html>

<!-- 60FPS initial paint critical CSS optimizations applied -->
