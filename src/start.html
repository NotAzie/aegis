<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyBrowser - New Tab</title>
  <style>
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    p { color: #888; margin-bottom: 24px; }
    input {
      width: 460px;
      padding: 12px 18px;
      font-size: 1rem;
      border-radius: 24px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
  </style>
</head>
<body>
  <h1>PrivacyBrowser</h1>
  <p>Browse without being watched.</p>
  <form onsubmit="event.preventDefault(); window.location.href='https://duckduckgo.com/?q=' + encodeURIComponent(document.getElementById('q').value);">
    <input type="text" id="q" placeholder="Search with DuckDuckGo or enter address..." autofocus />
  </form>
</body>
</html>
